[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pefy-sovereign-runtime"
version = "0.1.0"
description = "Provider-neutral sovereign AI orchestration runtime for PEFY-GG revenue, cash and advisory intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - PEFY-GG" }
authors = [{ name = "PEFY-TECH / Dr Erick Franck PATHINVO" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "openai>=1.68,<3",
  "mcp>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]
